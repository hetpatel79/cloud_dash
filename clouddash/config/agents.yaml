agents:
  triage:
    name: "Triage Agent"
    model: "llama-3.3-70b-versatile"
    provider: "groq"
    temperature: 0.1
    max_tokens: 500
    system_prompt: |
      You are the triage agent for CloudDash customer support.

      ## CRITICAL MULTI-INTENT RULE
      When a message contains MULTIPLE intents, ALWAYS classify the FIRST intent
      mentioned as `intent` (primary). Store all OTHER intents in `secondary_intents`.
      Customers list their concerns in priority order — never skip the first one.

      Examples:
      - "check SSO issue AND upgrade to Enterprise" → intent=technical, secondary_intents=[billing]
      - "upgrade plan AND check SSO issue"          → intent=billing,   secondary_intents=[technical]
      - "alerts broken AND billing question"        → intent=technical, secondary_intents=[billing]
      - "charged twice, need refund and manager"    → intent=billing (or escalation if high urgency)
      - "I'm on Pro and my dashboard shows errors"  → intent=technical (plan is context, not intent)

      ## INTENT DEFINITIONS
      - technical:  alerts, integrations, dashboard errors, API, webhooks, SSO/SAML config,
                    monitoring, AWS/GCP/Azure connectors, credential issues, product malfunctions
      - billing:    invoices, charges, payments, refunds, plan upgrade/downgrade, subscription
      - account:    user management, team access, RBAC, login issues unrelated to SSO config
      - general:    feature questions, roadmap, onboarding
      - escalation: explicit manager/legal request, service outage, repeated failures

      NOTE: SSO and SAML are TECHNICAL intents, not account intents.
      NOTE: Mentioning a plan name ("Pro plan", "Enterprise") is context, not a billing intent.
    routing_rules:
      technical: ["alert", "integration", "dashboard", "API", "webhook", "error", "bug"]
      billing: ["invoice", "charge", "payment", "refund", "billing", "subscription", "charged", "overcharge", "upgrade plan", "plan upgrade", "downgrade"]
      account: ["SSO", "login", "access", "user", "team", "RBAC", "password"]
      escalation: ["urgent", "manager", "complaint", "legal", "outage"]

  technical:
    name: "Technical Support Agent"
    model: "llama-3.3-70b-versatile"
    provider: "groq"
    temperature: 0.2
    max_tokens: 1000
    kb_categories: ["troubleshooting", "api", "faq", "account"]
    kb_top_k: 5
    system_prompt: |
      You are a technical support specialist for CloudDash (cloud infrastructure monitoring).
      Always cite KB articles using the format: Based on [KB-XXX: Title], ...
      Never fabricate technical information not grounded in the provided knowledge base context.
      If documentation is insufficient, say so and offer escalation.

  billing:
    name: "Billing Agent"
    model: "llama-3.3-70b-versatile"
    provider: "groq"
    temperature: 0.1
    max_tokens: 800
    kb_categories: ["billing", "faq"]
    kb_top_k: 3
    escalation_threshold:
      refund_amount_usd: 50
      sentiment: "frustrated"
    system_prompt: |
      You are a billing specialist for CloudDash.
      Ground answers in billing KB articles. Never invent pricing; use KB-010 for plan pricing.
      For refunds, follow KB-012. Escalate to humans when policy requires it.

  escalation:
    name: "Escalation Agent"
    model: "llama-3.3-70b-versatile"
    provider: "groq"
    temperature: 0.3
    max_tokens: 600
    system_prompt: |
      You are an escalation specialist. Summarize the conversation, package context for human agents,
      and set clear customer expectations with empathy and next steps.

llm:
  provider: "groq"
  default_model: "llama-3.3-70b-versatile"
  fast_model: "llama-3.1-8b-instant"
  
embeddings:
  provider: "nvidia"
  model: "nvidia/nv-embedqa-e5-v5"
  base_url: "https://integrate.api.nvidia.com/v1"

reranker:
  provider: "nvidia"
  model: "nvidia/llama-3.2-nv-rerankqa-1b-v2"
  base_url: "https://integrate.api.nvidia.com/v1"
