qdrant:
  mode: "memory"
  url: ""
  collection_name: "clouddash_kb"
  vector_size: 1536

retrieval:
  embedding_model: "text-embedding-3-small"
  top_k: 5
  hybrid_weight_vector: 0.7
  hybrid_weight_bm25: 0.3
  rerank_enabled: false
  query_rewrite_llm: true

logging:
  level: "INFO"
  format: "json"
  output: "stdout"
  file: "logs/app.jsonl"

guardrails:
  input_enabled: true
  output_enabled: true
  pii_redaction: true
  hallucination_check: true
